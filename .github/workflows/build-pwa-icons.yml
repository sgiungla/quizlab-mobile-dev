name: Build PWA icons

on:
  push:
    branches: [main]
    paths:
      - ".icon-source/**"
      - ".github/workflows/build-pwa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild exact verified mascot icon
        run: |
          cat .icon-source/part-000.txt .icon-source/part-001.txt .icon-source/part-002.txt .icon-source/part-003.txt .icon-source/part-004.txt > /tmp/icon.b64
          base64 --decode /tmp/icon.b64 > icons/quizlab-sgiungla-192.png
          echo "f0596c5504ce8ea70d748a63f44ac8ef6a4dd902d191f3f81382677517ecae79  icons/quizlab-sgiungla-192.png" | sha256sum -c -

      - name: Generate verified 512 icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open("icons/quizlab-sgiungla-192.png").convert("RGBA")
          src.load()
          assert src.size == (192,192), src.size
          out = src.resize((512,512), Image.Resampling.LANCZOS)
          out.save("icons/quizlab-sgiungla-512.png", optimize=True)
          check = Image.open("icons/quizlab-sgiungla-512.png")
          check.load()
          assert check.size == (512,512), check.size
          print("VALID", src.size, check.size)
          PY

      - name: Commit verified icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/quizlab-sgiungla-192.png icons/quizlab-sgiungla-512.png
          if git diff --cached --quiet; then
            echo "Icons already exact."
          else
            git commit -m "Restore exact verified QuizLab Sgiungla icons"
            git push
          fi
