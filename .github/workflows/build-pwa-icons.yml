name: Build PWA icons

on:
  push:
    branches: [main]
    paths:
      - "assets/jungle-sidebar-mascot.webp"
      - ".github/workflows/build-pwa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate exact Sgiungla mascot PWA icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open("assets/jungle-sidebar-mascot.webp").convert("RGB")
          # Square crop chosen to keep hat + monkey + QuizLab + SGIUNGLA all INSIDE the icon.
          crop = src.crop((0, 190, 352, 542))
          for size in (192, 512):
              im = crop.resize((size, size), Image.Resampling.LANCZOS)
              im.save(f"icons/quizlab-sgiungla-monkey-{size}.png", optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/quizlab-sgiungla-monkey-192.png icons/quizlab-sgiungla-monkey-512.png
          if git diff --cached --quiet; then
            echo "Icons already up to date."
          else
            git commit -m "Generate exact Sgiungla monkey PWA icons"
            git push
          fi
