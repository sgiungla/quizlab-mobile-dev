name: Build PWA icons

on:
  push:
    branches: [main]
    paths:
      - "icons/quizlab-sgiungla-monkey-192.png"
      - ".github/workflows/build-pwa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build 512 icon from verified 192 PNG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open("icons/quizlab-sgiungla-monkey-192.png").convert("RGBA")
          if src.size != (192,192):
              raise SystemExit(f"Unexpected source size: {src.size}")
          src.load()
          im = src.resize((512,512), Image.Resampling.LANCZOS)
          im.save("icons/quizlab-sgiungla-monkey-512.png", optimize=True)
          PY
      - name: Commit generated 512 icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/quizlab-sgiungla-monkey-512.png
          if git diff --cached --quiet; then
            echo "512 icon already up to date."
          else
            git commit -m "Regenerate 512 PWA icon from verified mascot PNG"
            git push
          fi
