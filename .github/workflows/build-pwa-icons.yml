name: Build PWA icons

on:
  push:
    branches: [main]
    paths:
      - "icons/quizlab-sgiungla-v106.svg"
      - ".github/workflows/build-pwa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate valid raster PWA icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          src="icons/quizlab-sgiungla-v106.svg"
          for size in (192,512):
              cairosvg.svg2png(url=src,write_to=f"icons/quizlab-sgiungla-app-{size}.png",output_width=size,output_height=size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/quizlab-sgiungla-app-192.png icons/quizlab-sgiungla-app-512.png
          if git diff --cached --quiet; then
            echo "Icons already up to date."
          else
            git commit -m "Generate valid PWA install icons"
            git push
          fi
